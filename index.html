<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos de Mamá</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body style="background:#f6f5f8">
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const initialData=[
 {id:101,fecha:"2026-09-12",monto:32.37,descripcion:"Santa Maria",tipo:"gasto",foto:null,lugar:"Santa Maria"},
 {id:102,fecha:"2026-09-12",monto:9.02,descripcion:"compras de casa",tipo:"gasto",foto:null,lugar:""},
 {id:103,fecha:"2026-09-11",monto:3.03,descripcion:"Enterogermina",tipo:"gasto",foto:null,lugar:""},
 {id:201,fecha:"2026-09-10",monto:100,descripcion:"Depósito",tipo:"deposito",foto:null,lugar:""}
];
function App(){
  const [gastos,setGastos]=React.useState(()=>{try{const s=localStorage.getItem('gastos_mama_github');return s?JSON.parse(s):initialData}catch{return initialData}});
  const [fecha,setFecha]=React.useState("2026-09-12");
  const [monto,setMonto]=React.useState(""); const [desc,setDesc]=React.useState(""); const [lugar,setLugar]=React.useState("");
  const [foto,setFoto]=React.useState(null); const [ocrLoading,setOcrLoading]=React.useState(false); const [ocrProgress,setOcrProgress]=React.useState(0);
  const [showSaldo,setShowSaldo]=React.useState(false);
  const [saldoManual,setSaldoManual]=React.useState(()=>localStorage.getItem('saldo_manual_github')||"");
  React.useEffect(()=>{localStorage.setItem('gastos_mama_github',JSON.stringify(gastos))},[gastos]);
  const saldoCalc=React.useMemo(()=>{let dep=0,gas=0;gastos.forEach(g=>{if(g.tipo==='deposito')dep+=g.monto;else gas+=g.monto});return 60+dep-gas},[gastos]);
  const saldo=saldoManual?parseFloat(saldoManual):saldoCalc;
  const handleFoto=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const b64=ev.target.result; setFoto(b64); setOcrLoading(true);
      try{
        const res=await Tesseract.recognize(b64,'spa+eng',{logger:m=>{if(m.status==='recognizing text')setOcrProgress(Math.round(m.progress*100))}});
        const text=res.data.text;
        const totalMatch=text.match(/total.*?\$?\s*(\d+[\.,]\d{2})/i);
        let md=totalMatch?totalMatch[1]:null;
        if(!md){const ms=[...text.matchAll(/\$?\s*(\d+[\.,]\d{2})/g)].map(m=>m[1]); if(ms.length) md=ms[ms.length-1];}
        if(md) setMonto(md.replace(',','.'));
        const fm=text.match(/(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/);
        if(fm){const p=fm[1].split(/[\/-]/); const iso=`${p[2].length===4?p[2]:'20'+p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; setFecha(iso);}
        const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>4);
        if(lines[0]){ setLugar(lines[0].substring(0,35)); setDesc(lines[0].substring(0,35)); }
      }catch{} setOcrLoading(false);
    }; reader.readAsDataURL(file);
  };
  return (
    <div className="max-w-md mx-auto px-4 py-6">
      <h1 className="text-[28px] font-extrabold mb-4">Gastos de Mamá</h1>
      <div className="bg-white rounded-[20px] p-5 shadow-sm mb-4" onClick={()=>setShowSaldo(true)}>
        <div className="text-[13px] text-gray-500">Saldo disponible <span className="bg-gray-100 rounded-full px-2 py-1 ml-2">✏️ Editar</span></div>
        <div className="text-[36px] font-black">${saldo.toFixed(2)}</div>
      </div>
      {showSaldo && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h3 className="font-bold mb-2">Ajustar saldo real</h3>
            <p className="text-sm text-gray-500 mb-3">Sistema dice ${saldoCalc.toFixed(2)} pero tienes $180 en mano</p>
            <input value={saldoManual} onChange={e=>setSaldoManual(e.target.value)} placeholder="180" className="w-full border rounded-xl px-4 h-12 text-lg font-bold" />
            <div className="flex gap-2 mt-4"><button onClick={()=>{setSaldoManual(""); setShowSaldo(false)}} className="flex-1 border rounded-xl h-12">Quitar</button><button onClick={()=>setShowSaldo(false)} className="flex-1 bg-black text-white rounded-xl h-12">Guardar</button></div>
          </div>
        </div>
      )}
      <div className="bg-white rounded-[28px] p-6 shadow-sm">
        <h2 className="font-bold text-[20px]">Registrar gasto</h2>
        <p className="text-[13px] text-gray-500 mb-4">Toma foto del recibo y se auto-llena</p>
        <div className="flex gap-2 mb-3"><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} className="flex-1 border rounded-xl px-3 h-12" /><button onClick={()=>setFecha(new Date().toISOString().split('T')[0])} className="bg-[#eef0ff] text-indigo-700 rounded-xl px-3">Hoy</button></div>
        <input value={monto} onChange={e=>setMonto(e.target.value)} placeholder="0,00" className="w-full border rounded-xl px-4 h-12 mb-3 font-semibold" />
        <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Descripción" className="w-full border rounded-xl px-4 py-3 mb-3"></textarea>
        <input value={lugar} onChange={e=>setLugar(e.target.value)} placeholder="Lugar de consumo" className="w-full border rounded-xl px-4 h-12 mb-3" />
        <div className="relative mb-3"><input type="file" accept="image/*" capture="environment" onChange={handleFoto} className="absolute inset-0 opacity-0 w-full h-full"/><div className="border-2 border-dashed border-indigo-200 bg-indigo-50/60 rounded-xl p-4 text-center text-indigo-700 font-semibold">📷 Tomar foto del recibo</div></div>
        {ocrLoading && <div className="bg-indigo-50 rounded-xl p-3 mb-3 text-sm text-indigo-700">🔍 Leyendo recibo... {ocrProgress}%</div>}
        {foto && <img src={foto} className="w-full h-40 object-cover rounded-xl mb-3" />}
        <button onClick={()=>{const m=parseFloat(monto); if(!m) return; setGastos(p=>[{id:Date.now(),fecha,monto:m,descripcion:desc,lugar,tipo:'gasto',foto},...p]); setMonto(""); setDesc(""); setLugar(""); setFoto(null);}} className="w-full bg-black text-white rounded-2xl h-12 font-semibold">Guardar gasto</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
