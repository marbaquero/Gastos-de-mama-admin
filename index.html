<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos de Mamá — Administrador</title>
<link rel="apple-touch-icon" href="icono-gastos-admin.png">
<link rel="icon" type="image/png" href="icono-gastos-admin.png">
<meta name="apple-mobile-web-app-title" content="Gastos Admin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}
.w{max-width:860px;margin:auto;padding:14px}.c{background:#fff;border-radius:18px;padding:18px;margin:12px 0;position:relative}
h1{font-size:28px}.bal{font-size:38px;font-weight:800}.mut{color:#68707d;font-size:14px}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;font:inherit;border-radius:12px}
input,select{padding:13px;border:1px solid #ccd0d5;background:#fff}button{padding:14px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.m{text-align:right}.dep{color:#067647}.gas{color:#b42318}
.del{background:#fee2e2;color:#991b1b;padding:6px 10px;margin:0;width:auto;border-radius:8px}
.btn-edit{background:#eef2ff;color:#3730a3;padding:6px 10px;margin:0;width:auto;border-radius:8px}
.btn-small{padding:7px 9px;margin:0;width:auto;font-size:13px}
.msg{padding:10px;border-radius:10px;background:#ecfdf3;color:#067647;margin:10px 0}.err{background:#fef3f2;color:#b42318}
.summary{line-height:1.75}.rt{text-align:center;margin-bottom:2px}.rp{text-align:center;color:#68707d;margin-top:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
</style>
</head>
<body>
<div id="auth-gate" class="w" style="text-align:center;margin-top:100px;display:none">
  <h2>Verificando cuenta...</h2>
</div>
<div id="app" class="w hide">
  <h1>Gastos de Mamá — Administrador</h1>
  <div class="c">
    <div class="mut">Saldo disponible</div>
    <div class="bal" id="saldo">$0.00</div>
    <div class="mut">Total gastos: <span id="tot-gastos">$0.00</span></div>
    <div class="mut">Total depósitos: <span id="tot-depositos">$0.00</span></div>
  </div>

  <div class="c">
    <h2>Nuevo depósito</h2>
    <label>Fecha</label><input type="date" id="f-fecha">
    <label>Monto</label><input type="number" step="0.01" id="f-monto">
    <label>Descripción</label><input type="text" id="f-desc" value="Depósito">
    <button id="btn-add">Agregar depósito</button>
    <div id="msg-add" class="msg hide"></div>
  </div>

  <div class="c">
    <h2>Reporte mensual</h2>
    <div class="grid">
      <div><label>Mes</label><select id="r-mes"></select></div>
      <div><label>Año</label><select id="r-anio"></select></div>
    </div>
    <button id="btn-report">Generar reporte</button>
  </div>

  <div class="c">
    <h2>Todos los movimientos</h2>
    <div class="toolbar">
      <button class="btn-small" style="background:#111" data-filter="todos">Todos</button>
      <button class="btn-small" style="background:#eee;color:#000" data-filter="gasto">Solo gastos</button>
      <button class="btn-small" style="background:#eee;color:#000" data-filter="deposito">Solo depósitos</button>
    </div>
    <div class="mut" style="margin-bottom:10px">Por persona: 
      <button class="btn-small" data-person="Aracely">Aracely</button>
      <button class="btn-small" data-person="Genesis">Genesis</button>
      <button class="btn-small" data-person="Ibeth">Ibeth</button>
    </div>
    <table id="t-movs"><tbody></tbody></table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fftnffmttuzfftntzzhu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdG5mZm10dHV6ZmZ0bnR6emh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTgxNzAsImV4cCI6MjEwOTQ5NDE3MH0.lmYfQeXAq6oPZ-UMj8AQXQq2snU78FatLMbwRftaMyM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let householdId = null;
let currentFilter = 'todos';
let currentPerson = null;

async function init() {
  document.getElementById('auth-gate').style.display = 'block';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/portal.html'; return; }

  const { data: member } = await sb.from('household_members').select('household_id, role').eq('user_id', session.user.id).maybeSingle();
  
  if (!member) {
    document.getElementById('auth-gate').innerHTML = '<h2>Error: Tu cuenta no está vinculada a una familia.</h2><a href="/portal.html">Volver al portal</a>';
    return;
  }
  if (member.role !== 'owner') {
    document.getElementById('auth-gate').innerHTML = '<h2>Error: No tienes permiso para ver el área de administración.</h2><a href="/portal.html">Volver al portal</a>';
    return;
  }

  householdId = member.household_id;
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('app').classList.remove('hide');
  
  document.getElementById('f-fecha').valueAsDate = new Date();
  
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const mesSel = document.getElementById('r-mes'); const anioSel = document.getElementById('r-anio');
  const hoy = new Date();
  meses.forEach((m,i)=>{ let o=document.createElement('option'); o.value=i; o.text=m; if(i===hoy.getMonth())o.selected=true; mesSel.appendChild(o); });
  for(let a=hoy.getFullYear()-2; a<=hoy.getFullYear()+1; a++){ let o=document.createElement('option'); o.value=a; o.text=a; if(a===hoy.getFullYear())o.selected=true; anioSel.appendChild(o); }

  loadData();
}

async function loadData() {
  const { data: sumData } = await sb.from('expense_movements').select('amount, type').eq('household_id', householdId);
  let gastos=0, depositos=0;
  if (sumData) sumData.forEach(r => { if(r.type==='gasto') gastos+=Number(r.amount); if(r.type==='deposito') depositos+=Number(r.amount); });
  document.getElementById('saldo').textContent = `$${(depositos-gastos).toFixed(2)}`;
  document.getElementById('tot-gastos').textContent = `$${gastos.toFixed(2)}`;
  document.getElementById('tot-depositos').textContent = `$${depositos.toFixed(2)}`;

  let q = sb.from('expense_movements').select('*').eq('household_id', householdId).order('created_at', {ascending:false}).limit(50);
  if (currentFilter !== 'todos') q = q.eq('type', currentFilter);
  if (currentPerson) q = q.eq('registered_by', currentPerson);
  
  const { data: movs } = await q;
  const tbody = document.querySelector('#t-movs tbody');
  tbody.innerHTML = '';
  if(!movs || movs.length===0){ tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:#666">No hay movimientos</td></tr>'; return; }
  
  movs.forEach(m => {
    const isG = m.type === 'gasto';
    tbody.innerHTML += `
      <tr>
        <td>${new Date(m.movement_date).toLocaleDateString()}</td>
        <td><b class="${isG?'gas':'dep'}">${isG?'-':'+'}$${Number(m.amount).toFixed(2)}</b><br><span class="mut" style="font-size:12px">${m.description||''}</span></td>
        <td>${m.registered_by||''}</td>
        <td style="text-align:right"><button class="del" onclick="deleteMov(${m.id})">X</button></td>
      </tr>
    `;
  });
}

document.getElementById('btn-add').onclick = async () => {
  const monto = parseFloat(document.getElementById('f-monto').value);
  if(!monto || monto<=0) return alert("Monto inválido");
  
  const { error } = await sb.from('expense_movements').insert({
    household_id: householdId,
    movement_date: document.getElementById('f-fecha').value,
    type: 'deposito',
    amount: monto,
    description: document.getElementById('f-desc').value,
    registered_by: 'Admin'
  });
  
  if(error) { document.getElementById('msg-add').textContent = error.message; document.getElementById('msg-add').className='msg err'; }
  else { document.getElementById('f-monto').value=''; document.getElementById('msg-add').textContent='Depósito guardado.'; document.getElementById('msg-add').className='msg'; loadData(); }
  document.getElementById('msg-add').classList.remove('hide');
};

window.deleteMov = async (id) => {
  if(!confirm("¿Borrar movimiento?")) return;
  const { error } = await sb.from('expense_movements').delete().eq('id', id).eq('household_id', householdId);
  if(!error) loadData();
};

document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-filter]').forEach(x=>x.style.background='#eee');
  b.style.background='#111'; b.style.color='#fff';
  currentFilter = b.dataset.filter;
  loadData();
});

document.querySelectorAll('[data-person]').forEach(b => b.onclick = () => {
  currentPerson = currentPerson === b.dataset.person ? null : b.dataset.person;
  loadData();
});

init();
</script>
</body>
</html>
