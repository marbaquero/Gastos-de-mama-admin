<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos de Mamá — Administrador</title>
<link rel="apple-touch-icon" href="icono-gastos-admin.png">
<link rel="icon" type="image/png" href="icono-gastos-admin.png">
<meta name="apple-mobile-web-app-title" content="Gastos Admin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}
.w{max-width:860px;margin:auto;padding:14px}.c{background:#fff;border-radius:18px;padding:18px;margin:12px 0;position:relative}
h1{font-size:28px}.bal{font-size:38px;font-weight:800}.mut{color:#68707d;font-size:14px}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;font:inherit;border-radius:12px}
input,select{padding:13px;border:1px solid #ccd0d5;background:#fff}button{padding:14px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.m{text-align:right}.dep{color:#067647}.gas{color:#b42318}
.del{background:#fee2e2;color:#991b1b;padding:6px 10px;margin:0;width:auto;border-radius:8px}
.btn-edit{background:#eef2ff;color:#3730a3;padding:6px 10px;margin:0;width:auto;border-radius:8px}
.btn-small{padding:7px 9px;margin:0;width:auto;font-size:13px}
.msg{padding:10px;border-radius:10px;background:#ecfdf3;color:#067647;margin:10px 0}.err{background:#fef3f2;color:#b42318}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;}
.bulk-btn{background:#111;color:#fff;width:auto;padding:10px 16px;margin-right:8px}
.bulk-del{background:#fee2e2;color:#991b1b;width:auto;padding:10px 16px;margin-top:10px;margin-bottom:10px}
.btn-recibo{background:#111;color:#fff;padding:4px 8px;font-size:12px;border-radius:6px;margin-left:8px;width:auto}
.action-buttons { display: flex; gap: 6px; justify-content: flex-end; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal-content { background: #fff; border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-content h2 { margin-top: 0; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button { flex: 1; }
.modal-actions .cancel { background: #e5e7eb; color: #111; }
</style>
</head>
<body>
<div id="app" class="w">
  <h1>Gastos de Mamá — Administrador</h1>
  <div class="c">
    <div class="top-row">
      <div>
        <div class="mut">Saldo disponible</div>
        <div class="bal" id="saldo">$0.00</div>
        <div class="mut">Total gastos: <span id="tot-gastos">$0.00</span></div>
        <div class="mut">Total depósitos: <span id="tot-depositos">$0.00</span></div>
      </div>
      <button class="btn-edit" id="btn-edit-bal">✎ Editar</button>
    </div>
  </div>

  <div class="c">
    <h2>Nuevo depósito</h2>
    <label>Fecha</label><input type="date" id="f-fecha">
    <label>Monto</label><input type="number" step="0.01" id="f-monto">
    <label>Descripción</label><input type="text" id="f-desc" value="Depósito">
    <button id="btn-add">Agregar depósito</button>
    <div id="msg-add" class="msg hide"></div>
  </div>

  <div class="c">
    <h2>Todos los movimientos</h2>
    <div class="toolbar">
      <button class="btn-small" style="background:#111;color:#fff" data-filter="todos">Todos</button>
      <button class="btn-small" style="background:#eee;color:#000" data-filter="gasto">Solo gastos</button>
      <button class="btn-small" style="background:#eee;color:#000" data-filter="deposito">Solo depósitos</button>
    </div>
    <select id="f-month" style="margin-bottom:12px; max-width:200px;"><option value="">Todos los meses</option></select>
    <div class="mut" style="margin-bottom:10px">Por persona: 
      <button class="btn-small" data-person="Aracely">Aracely</button>
      <button class="btn-small" data-person="Genesis">Genesis</button>
      <button class="btn-small" data-person="Ibeth">Ibeth</button>
    </div>
    <div>
      <button class="bulk-btn" id="btn-sel-all">Seleccionar todo</button>
      <button class="bulk-btn" id="btn-deselect">Deseleccionar</button>
    </div>
    <button class="bulk-del" id="btn-del-sel">Eliminar seleccionados</button>
    <table id="t-movs">
      <thead><tr><th style="width:40px"></th><th>Fecha</th><th>Descripción</th><th class="m">Monto</th><th>Recibo</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal-content">
    <h2>Editar Movimiento</h2>
    <input type="hidden" id="e-id">
    <label>Fecha</label><input type="date" id="e-fecha">
    <label>Monto</label><input type="number" step="0.01" id="e-monto">
    <label>Descripción</label><input type="text" id="e-desc">
    <label>Registrado por</label>
    <select id="e-person">
      <option value="Admin">Admin</option><option value="Aracely">Aracely</option><option value="Genesis">Genesis</option><option value="Ibeth">Ibeth</option>
    </select>
    <label>Recibo</label>
    <div id="e-recibo-wrap"></div>
    <input type="file" id="e-file" accept="image/*" style="margin-top:8px; border:none; padding:0;">
    <div class="modal-actions"><button class="cancel" onclick="closeEdit()">Cancelar</button><button onclick="saveEdit()">Guardar Cambios</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fftnffmttuzfftntzzhu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdG5mZm10dHV6ZmZ0bnR6emh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTgxNzAsImV4cCI6MjEwOTQ5NDE3MH0.lmYfQeXAq6oPZ-UMj8AQXQq2snU78FatLMbwRftaMyM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const householdId = '52f6a501-30e3-4c2a-9c56-8d6268cd7a4e'; 
let currentFilter = 'todos'; let currentPerson = null; let currentMonth = ''; let currentBalance = 0; let currentReceipt = null;

async function init() {
  document.getElementById('f-fecha').valueAsDate = new Date();
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const monthFilter = document.getElementById('f-month');
  meses.forEach((m,i)=>{ let o2=document.createElement('option'); o2.value=i+1; o2.text=m; monthFilter.appendChild(o2); });
  loadData();
}

async function loadData() {
  const { data: sumData } = await sb.from('expense_movements').select('amount, type').eq('household_id', householdId);
  let gastos=0, depositos=0;
  if (sumData) sumData.forEach(r => { if(r.type==='gasto') gastos+=Number(r.amount); if(r.type==='deposito') depositos+=Number(r.amount); });
  currentBalance = depositos - gastos;
  document.getElementById('saldo').textContent = `$${currentBalance.toFixed(2)}`;
  document.getElementById('tot-gastos').textContent = `$${gastos.toFixed(2)}`;
  document.getElementById('tot-depositos').textContent = `$${depositos.toFixed(2)}`;

  let q = sb.from('expense_movements').select('*').eq('household_id', householdId).order('created_at', {ascending:false}).limit(100);
  if (currentFilter !== 'todos') q = q.eq('type', currentFilter);
  if (currentPerson) q = q.eq('registered_by', currentPerson);
  if (currentMonth) {
    const year = new Date().getFullYear();
    const start = `${year}-${currentMonth.toString().padStart(2,'0')}-01`;
    const end = new Date(year, currentMonth, 0).toISOString().split('T')[0];
    q = q.gte('movement_date', start).lte('movement_date', end);
  }
  
  const { data: movs } = await q;
  const tbody = document.querySelector('#t-movs tbody');
  tbody.innerHTML = '';
  if(!movs || movs.length===0){ tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#666">No hay movimientos</td></tr>'; return; }
  
  movs.forEach(m => {
    const isG = m.type === 'gasto';
    const recibo = m.receipt_path ? `<button class="btn-recibo" onclick="verRecibo('${m.receipt_path}')">Ver recibo</button>` : '';
    tbody.innerHTML += `
      <tr>
        <td><input type="checkbox" class="row-check" data-id="${m.id}"></td>
        <td>${new Date(m.movement_date).toLocaleDateString()}</td>
        <td><span class="mut" style="font-size:12px">${m.description||''}</span>${m.registered_by ? ` <span style="color:#3b82f6; text-decoration:underline; cursor:pointer" onclick="document.querySelector('[data-person=\\'${m.registered_by}\\']').click()">${m.registered_by}</span>` : ''}</td>
        <td class="m"><b class="${isG?'gas':'dep'}">${isG?'-':'+'}$${Number(m.amount).toFixed(2)}</b></td>
        <td>${recibo}</td>
        <td><div class="action-buttons"><button class="btn-edit" onclick='openEdit(${JSON.stringify(m)})'>✎</button><button class="del" onclick="deleteMov(${m.id})">X</button></div></td>
      </tr>
    `;
  });
}

window.verRecibo = async (path) => {
  const { data, error } = await sb.storage.from('recibos').createSignedUrl(path, 60);
  if(error) return alert("Error: " + error.message);
  window.open(data.signedUrl, '_blank');
};

window.openEdit = (m) => {
  document.getElementById('e-id').value = m.id;
  document.getElementById('e-fecha').value = m.movement_date;
  document.getElementById('e-monto').value = m.amount;
  document.getElementById('e-desc').value = m.description || '';
  document.getElementById('e-person').value = m.registered_by || 'Admin';
  currentReceipt = m.receipt_path;
  const wrap = document.getElementById('e-recibo-wrap');
  if(currentReceipt) wrap.innerHTML = `<span style="color:#067647; font-size:14px">✓ Recibo actual guardado</span> <button type="button" class="btn-small" onclick="verRecibo('${currentReceipt}')">Ver</button>`;
  else wrap.innerHTML = `<span style="color:#68707d; font-size:14px">Sin recibo</span>`;
  document.getElementById('e-file').value = '';
  document.getElementById('edit-modal').classList.add('active');
};

window.closeEdit = () => document.getElementById('edit-modal').classList.remove('active');

window.saveEdit = async () => {
  const id = document.getElementById('e-id').value;
  const fecha = document.getElementById('e-fecha').value;
  const monto = parseFloat(document.getElementById('e-monto').value);
  const desc = document.getElementById('e-desc').value;
  const person = document.getElementById('e-person').value;
  const file = document.getElementById('e-file').files[0];
  if(!monto || monto <= 0) return alert("Monto inválido");
  let newReceiptPath = currentReceipt;
  if (file) {
    const ext = file.name.split('.').pop();
    newReceiptPath = `${householdId}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('recibos').upload(newReceiptPath, file);
    if(upErr) return alert("Error subiendo recibo: " + upErr.message);
  }
  const { error } = await sb.from('expense_movements').update({ movement_date: fecha, amount: monto, description: desc, registered_by: person, receipt_path: newReceiptPath }).eq('id', id).eq('household_id', householdId);
  if(error) alert(error.message);
  else { closeEdit(); loadData(); }
};

window.deleteMov = async (id) => {
  if(!confirm("¿Borrar movimiento?")) return;
  const { error } = await sb.from('expense_movements').delete().eq('id', id).eq('household_id', householdId);
  if(!error) loadData();
};

document.getElementById('btn-sel-all').onclick = () => document.querySelectorAll('.row-check').forEach(c => c.checked = true);
document.getElementById('btn-deselect').onclick = () => document.querySelectorAll('.row-check').forEach(c => c.checked = false);
document.getElementById('btn-del-sel').onclick = async () => {
  const checks = [...document.querySelectorAll('.row-check')].filter(c => c.checked).map(c => c.dataset.id);
  if(checks.length === 0) return alert("Selecciona al menos un movimiento");
  if(!confirm(`¿Borrar ${checks.length} movimientos?`)) return;
  const { error } = await sb.from('expense_movements').delete().in('id', checks).eq('household_id', householdId);
  if(!error) loadData();
};

document.getElementById('f-month').onchange = (e) => { currentMonth = e.target.value; loadData(); };

document.getElementById('btn-add').onclick = async () => {
  const monto = parseFloat(document.getElementById('f-monto').value);
  if(!monto || monto<=0) return alert("Monto inválido");
  const { error } = await sb.from('expense_movements').insert({ household_id: householdId, movement_date: document.getElementById('f-fecha').value, type: 'deposito', amount: monto, description: document.getElementById('f-desc').value, registered_by: 'Admin' });
  if(error) { document.getElementById('msg-add').textContent = error.message; document.getElementById('msg-add').className='msg err'; }
  else { document.getElementById('f-monto').value=''; document.getElementById('msg-add').textContent='Depósito guardado.'; document.getElementById('msg-add').className='msg'; loadData(); }
  document.getElementById('msg-add').classList.remove('hide');
};

document.getElementById('btn-edit-bal').onclick = async () => {
  const nuevo = prompt("Ingresa el nuevo saldo disponible (ejemplo: 50.14).", currentBalance.toFixed(2));
  if (nuevo === null) return;
  const target = parseFloat(nuevo);
  if (isNaN(target)) return alert("Monto inválido");
  const diff = target - currentBalance;
  if (diff === 0) return;
  const type = diff > 0 ? 'deposito' : 'gasto';
  const amount = Math.abs(diff);
  const { error } = await sb.from('expense_movements').insert({ household_id: householdId, movement_date: new Date().toISOString().split('T')[0], type: type, amount: amount, description: 'Ajuste manual de saldo', registered_by: 'Admin' });
  if(error) alert(error.message);
  else loadData();
};

document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-filter]').forEach(x=>{x.style.background='#eee'; x.style.color='#000';});
  b.style.background='#111'; b.style.color='#fff';
  currentFilter = b.dataset.filter;
  loadData();
});

document.querySelectorAll('[data-person]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-person]').forEach(x=>{x.style.background='#eee'; x.style.color='#000';});
  if (currentPerson === b.dataset.person) { currentPerson = null; } 
  else { currentPerson = b.dataset.person; b.style.background='#111'; b.style.color='#fff'; }
  loadData();
});

init();
</script>
</body>
</html>
